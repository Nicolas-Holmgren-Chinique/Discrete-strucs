{% load static %}
<!DOCTYPE html>
<html>
  <head>
    <title>UCSD Dijkstras</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/@googlemaps/extended-component-library/0.6.11/index.min.js">
    </script>
    <link rel="stylesheet" href="{% static 'home/styles.css' %}"/>
  </head>
  <body>
    <gmpx-api-loader key="{{ google_maps_api_key }}" solution-channel="GMP_GE_mapsandplacesautocomplete_v2">
    </gmpx-api-loader>

    <!-- Map centered on UCSD campus using coordinates  -->
    <gmp-map center="32.8804, -117.23602" zoom="17" map-id="DEMO_MAP_ID" style="height: 500px; width: 650px;">
      <div slot="control-block-start-inline-start" class="place-picker-container">
        <gmpx-place-picker placeholder="Enter an address"></gmpx-place-picker>
      </div>
      <gmp-advanced-marker></gmp-advanced-marker>
    </gmp-map>
    <script src="{% static 'home/index.js' %}"></script>
  </body>
</html>
